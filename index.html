<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🔐 Password Checker</h1>
            <p class="subtitle">Create a strong and secure password</p>

            <label for="password">Enter Password</label>
            <div class="password-box">
                <input type="password" id="password"
                       placeholder="Enter your password">
                <button type="button" id="toggleBtn">Show</button>
            </div>

            <div class="strength-info">
                <span>Password Strength</span>
                <span id="strengthText">Not entered</span>
            </div>

            <div class="progress">
                <div id="strengthBar"></div>
            </div>

            <h3>Password Requirements</h3>
            <ul class="requirements">
                <li id="length">✗ At least 8 characters</li>
                <li id="upper">✗ One uppercase letter (A-Z)</li>
                <li id="lower">✗ One lowercase letter (a-z)</li>
                <li id="number">✗ One number (0-9)</li>
                <li id="special">✗ One special character (@, #, !)</li>
            </ul>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter your password">

            <p id="matchMessage" aria-live="polite"></p>

            <button type="button" id="resetBtn" class="reset">
                Reset All
            </button>

            <p class="footer">Stay Safe • Use Strong Passwords</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
